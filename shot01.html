<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; }

  /* 整体压暗，让印章跳出来 */
  .veil { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(0,0,0,.22) 0%, rgba(0,0,0,.66) 62%, rgba(0,0,0,.86) 100%); }

  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .seal { width: 470px; height: 470px; object-fit: contain;
          filter: drop-shadow(0 16px 42px rgba(0,0,0,.8)); transform-origin: 50% 50%; }

  .line { height: 3px; background: #d94b3a; margin: 44px 0 30px; box-shadow: 0 0 18px rgba(217,75,58,.5); }

  .tag { font-size: 40px; letter-spacing: 18px; color: #e8e0d2; text-indent: 18px;
         text-shadow: 0 6px 26px rgba(0,0,0,.85); }
</style>
</head>
<body>
<div class="veil"></div>
<div class="center">
  <img class="seal" id="seal" src="assets/logo.png" alt="">
  <div class="line" id="line" style="width:0"></div>
  <div class="tag" id="tag">说点说不清的</div>
</div>
<script type="module">
const seal = document.getElementById('seal');
const line = document.getElementById('line');
const tag = document.getElementById('tag');

const clamp01 = (x) => Math.max(0, Math.min(1, x));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);

window.film = {
  duration: 4,
  frame(t) {
    // 印章：0.1–0.8s 由小放大、轻微回正
    const p1 = easeOut(clamp01((t - 0.1) / 0.7));
    seal.style.opacity = String(clamp01((t - 0.05) / 0.28));
    seal.style.transform = `scale(${0.74 + 0.26 * p1}) rotate(${(1 - p1) * -5}deg)`;

    // 红线：0.6s 起由中间展开
    const p2 = easeOut(clamp01((t - 0.6) / 0.75));
    line.style.width = (440 * p2).toFixed(1) + 'px';

    // 栏目语：1.05s 起淡入
    const p3 = clamp01((t - 1.05) / 0.65);
    tag.style.opacity = String(p3);
    tag.style.transform = `translateY(${(1 - p3) * 14}px)`;
  },
};
</script>
</body>
</html>
